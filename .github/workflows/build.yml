name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q *.zip -d project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Java JVM target
        run: |
          echo "Searching Gradle files..."
          find project -name "*.gradle" -type f -print

          echo "Replacing Java 1.8 with Java 17..."
          find project -name "*.gradle" -type f -exec sed -i \
            -e 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' \
            -e 's/sourceCompatibility[[:space:]]*=[[:space:]]*1\.8/sourceCompatibility = 17/g' \
            -e 's/targetCompatibility[[:space:]]*=[[:space:]]*1\.8/targetCompatibility = 17/g' \
            -e 's/sourceCompatibility[[:space:]]*=[[:space:]]*"1\.8"/sourceCompatibility = "17"/g' \
            -e 's/targetCompatibility[[:space:]]*=[[:space:]]*"1\.8"/targetCompatibility = "17"/g' \
            -e 's/sourceCompatibility[[:space:]]*=[[:space:]]*'\''1\.8'\''/sourceCompatibility = '\''17'\''/g' \
            -e 's/targetCompatibility[[:space:]]*=[[:space:]]*'\''1\.8'\''/targetCompatibility = '\''17'\''/g' \
            {} \;

          echo "Checking remaining Java 1.8 settings..."
          grep -R "1.8" project --include="*.gradle" || true

      - name: Build APK
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          find project -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TiltWallpaper-APK
          path: project/**/build/outputs/apk/debug/*.apk
